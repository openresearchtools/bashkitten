<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BashKitten</title>
  <style>
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1e1e1e;
      --sidebar: #252526;
      --surface: #2b2b2b;
      --surface-2: #333337;
      --line: #48484d;
      --line-soft: #343438;
      --text: #e8e8e8;
      --muted: #a6a6aa;
      --accent: #a0a0a5;
      --accent-hover: #b8b8bd;
      --accent-text: #1e1e1e;
      --danger: #e07171;
      --ok: #6fbd86;
      --code: #181818;
      --activity: #232323;
      --overlay: #1e1e1eeb;
      --shadow: #0006;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f3f3;
      --sidebar: #e8e8e8;
      --surface: #ffffff;
      --surface-2: #e5e5e7;
      --line: #c8c8cc;
      --line-soft: #dcdcdf;
      --text: #242426;
      --muted: #66666b;
      --accent: #5f5f65;
      --accent-hover: #444449;
      --accent-text: #ffffff;
      --danger: #b84444;
      --ok: #34804e;
      --code: #ededf0;
      --activity: #f7f7f8;
      --overlay: #f3f3f3eb;
      --shadow: #0002;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f3f3f3;
        --sidebar: #e8e8e8;
        --surface: #ffffff;
        --surface-2: #e5e5e7;
        --line: #c8c8cc;
        --line-soft: #dcdcdf;
        --text: #242426;
        --muted: #66666b;
        --accent: #5f5f65;
        --accent-hover: #444449;
        --accent-text: #ffffff;
        --danger: #b84444;
        --ok: #34804e;
        --code: #ededf0;
        --activity: #f7f7f8;
        --overlay: #f3f3f3eb;
        --shadow: #0002;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-size: 14px; }
    button, input, select, textarea { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .52; }
    .hidden { display: none !important; }

    .icon-button {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
    }
    .icon-button:hover { border-color: var(--line); background: var(--surface-2); color: var(--text); }
    .icon-button.active { background: var(--surface-2); color: var(--text); }
    .primary { border: 0; background: var(--accent); color: var(--accent-text); font-weight: 650; }
    .primary:hover { background: var(--accent-hover); }

    #auth {
      width: min(380px, calc(100vw - 32px));
      margin: 12vh auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 24px 70px var(--shadow);
    }
    #auth h1 { margin: 0 0 8px; font-size: 24px; }
    #auth p { color: var(--muted); }
    #auth input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      outline: none;
    }
    #auth input:focus { border-color: var(--accent); }
    #auth button { width: 100%; margin-top: 5px; padding: 11px; border-radius: 10px; }

    #app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100dvh; }
    #sidebar { display: flex; min-width: 0; flex-direction: column; border-right: 1px solid var(--line-soft); background: var(--sidebar); }
    .sidebar-header { display: flex; height: 58px; align-items: center; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line-soft); }
    .new-chat {
      display: flex;
      min-width: 0;
      flex: 1;
      height: 41px;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      text-align: left;
    }
    .new-chat:hover { background: var(--surface-2); }
    .new-chat svg { width: 18px; height: 18px; flex: 0 0 auto; }
    #settingsBtn { flex: 0 0 auto; color: var(--text); }
    .settings-glyph { font-size: 18px; line-height: 1; }
    #sessions { flex: 1; overflow: auto; padding: 7px 8px 16px; }
    .folder-group { margin: 5px 0 12px; }
    .folder-heading {
      display: flex;
      height: 31px;
      min-width: 0;
      align-items: center;
      gap: 9px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 570;
    }
    .folder-heading svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .folder-heading span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session {
      position: relative;
      margin: 1px 0;
      padding: 7px 9px 7px 34px;
      overflow: hidden;
      border-radius: 7px;
      cursor: pointer;
    }
    .session:hover { background: var(--surface); }
    .session.active { background: var(--surface-2); }
    .session b { display: block; overflow: hidden; font-size: 13px; font-weight: 430; text-overflow: ellipsis; white-space: nowrap; }
    .running-dot { position: absolute; top: 12px; right: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
    #workspace { display: grid; min-width: 0; height: 100dvh; grid-template-rows: 58px minmax(0, 1fr) auto; }
    .topbar { display: flex; min-width: 0; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line-soft); }
    .chat-heading { display: flex; min-width: 0; flex: 1; align-items: center; gap: 10px; }
    #title { max-width: min(48vw, 540px); overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    #folderBtn {
      display: flex;
      min-width: 0;
      max-width: min(32vw, 360px);
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #folderBtn:not(:disabled):hover { border-color: var(--line); background: var(--surface-2); color: var(--text); }
    #folderBtn span { overflow: hidden; text-overflow: ellipsis; }
    #usage { flex: 0 0 auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
    #stopBtn { padding: 5px 9px; border: 1px solid var(--danger); border-radius: 6px; background: transparent; color: var(--danger); font-size: 11px; }

    #chat {
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    #settingsView { overflow: auto; }
    .settings-page { width: min(680px, calc(100% - 44px)); margin: 0 auto; padding: 28px 0 42px; }
    .settings-page h2 { margin: 0 0 18px; font-size: 20px; }
    .settings-page label { display: block; margin: 11px 0; color: var(--muted); font-size: 12px; }
    .settings-page input, .settings-page select { display: block; width: 100%; margin-top: 5px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .chat-inner { width: min(790px, calc(100% - 44px)); min-height: 100%; margin: 0 auto; padding: 24px 0 28px; }
    .welcome { display: grid; min-height: calc(100dvh - 260px); place-content: center; color: var(--muted); text-align: center; }
    .welcome .cat { margin-bottom: 8px; font-size: 30px; filter: grayscale(.15); }
    .welcome strong { color: var(--text); font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
    .welcome p { margin: 7px 0 0; font-size: 13px; }
    .message { display: flex; margin: 16px 0; }
    .message.activity-message { margin: 1px 0; }
    .message.user { justify-content: flex-end; }
    .message-content { min-width: 0; max-width: 100%; font-size: 15px; line-height: 1.62; overflow-wrap: anywhere; }
    .message.user .message-content { max-width: 82%; padding: 9px 13px; border-radius: 17px 17px 4px 17px; background: var(--surface-2); font-size: 14px; }
    .message.assistant .message-content { width: 100%; }
    .message.error .message-content { padding-left: 10px; border-left: 2px solid var(--danger); color: var(--danger); }
    .markdown p { margin: 0 0 8px; }
    .markdown p:last-child { margin-bottom: 0; }
    .markdown ul, .markdown ol { margin: 5px 0 10px; padding-left: 24px; }
    .markdown h1, .markdown h2, .markdown h3 { margin: 14px 0 7px; line-height: 1.25; }
    .markdown h1 { font-size: 20px; } .markdown h2 { font-size: 17px; } .markdown h3 { font-size: 15px; }
    .markdown code { padding: 2px 5px; border-radius: 4px; background: var(--code); color: var(--text); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .markdown pre, .tool-body pre { margin: 6px 0 0; padding: 9px 10px; overflow: auto; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--code); color: var(--text); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .message-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .message-images img { max-width: 300px; max-height: 240px; border-radius: 10px; object-fit: contain; }

    .turn-work {
      margin: 5px 0 14px;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
    }
    .turn-work > summary {
      display: flex;
      min-height: 35px;
      align-items: center;
      gap: 7px;
      padding: 2px 0 6px;
      cursor: pointer;
      list-style: none;
      font-size: 13px;
    }
    .turn-work > summary::-webkit-details-marker { display: none; }
    .turn-work > summary::after { color: var(--muted); content: "›"; font-size: 17px; transition: transform .12s; }
    .turn-work[open] > summary::after { transform: rotate(90deg); }
    .turn-work-body { padding: 2px 0 9px; }
    .thinking-block { margin: 2px 0 7px; color: var(--muted); }
    .thinking-label { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 570; }
    .thinking-block pre {
      margin: 0;
      padding: 1px 0 4px;
      overflow: visible;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: italic 13px/1.55 ui-sans-serif, system-ui, sans-serif;
      white-space: pre-wrap;
    }

    .activity {
      margin: 0;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }
    .activity[open] { border: 0; }
    .activity summary { display: flex; min-height: 32px; align-items: center; gap: 8px; padding: 3px 2px; cursor: pointer; list-style: none; font-size: 13px; }
    .activity summary::-webkit-details-marker { display: none; }
    .tool-icon { display: inline-grid; width: 17px; height: 17px; flex: 0 0 auto; place-items: center; border: 1px solid var(--muted); border-radius: 4px; color: var(--muted); font: 9px ui-monospace, monospace; }
    .activity .tool-name { color: var(--text); font-weight: 450; }
    .activity .tool-focus { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity summary::after { margin-left: auto; color: var(--muted); content: "⌄"; font-size: 14px; transform: rotate(-90deg); transition: transform .12s; }
    .activity[open] summary::after { transform: rotate(0deg); }
    .activity .tool-state { display: block; padding: 6px 10px; border-top: 1px solid var(--line-soft); color: var(--ok); font-size: 12px; text-align: right; }
    .activity.error .tool-state { color: var(--danger); }
    .tool-body { margin: 1px 20px 7px 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--activity); }
    .tool-body pre { max-height: 330px; margin: 0; padding: 10px 12px; border: 0; border-radius: 0; background: transparent; }
    .thought summary { color: var(--muted); font-style: normal; }
    .thought .tool-body { margin-left: 25px; }

    #composerWrap { padding: 0 16px 10px; background: linear-gradient(180deg, transparent, var(--bg) 12px); }
    #composer { width: min(790px, 100%); margin: 0 auto; }
    #attachmentTray { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 6px 8px; }
    .attachment { position: relative; width: 58px; height: 58px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .attachment img { width: 100%; height: 100%; object-fit: cover; }
    .attachment.file { display: flex; width: min(220px, 100%); height: 40px; align-items: center; gap: 8px; padding: 6px 27px 6px 9px; }
    .attachment-kind { flex: 0 0 auto; color: var(--muted); font: 9px ui-monospace, monospace; }
    .attachment-name { min-width: 0; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .attachment button { position: absolute; top: 2px; right: 2px; width: 19px; height: 19px; padding: 0; border: 0; border-radius: 50%; background: #000c; color: white; font-size: 12px; }
    .compose-box { position: relative; overflow: visible; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: none; }
    .compose-box:focus-within { border-color: var(--line); }
    .compose-box.dragging::after { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; border: 1px dashed var(--muted); border-radius: 18px; background: var(--overlay); color: var(--text); content: "Drop files"; pointer-events: none; }
    #prompt { display: block; width: 100%; min-height: 42px; max-height: 160px; padding: 10px 11px 2px; resize: none; border: 0; outline: 0; background: transparent; line-height: 1.4; }
    .composer-toolbar { display: flex; min-width: 0; align-items: center; gap: 2px; padding: 4px 5px 5px; }
    .composer-toolbar select { height: 27px; min-width: 0; padding: 0 22px 0 6px; overflow: hidden; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--muted); font-size: 11px; text-overflow: ellipsis; cursor: pointer; }
    .composer-toolbar select:hover { border-color: var(--line); background: var(--surface-2); color: var(--text); }
    .composer-toolbar select:focus { border-color: var(--line); outline: 0; box-shadow: none; }
    #model { width: 100px; } #thinking { width: 82px; }
    .toolbar-spacer { flex: 1; }
    #attachBtn { width: 27px; height: 27px; }
    #sendBtn { width: 29px; height: 29px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 15px; }
    #sendBtn:hover { background: var(--muted); }
    #composerHint { min-height: 14px; padding-top: 3px; color: var(--muted); font-size: 10px; text-align: center; }

    #queuePanel { display: flex; max-height: 140px; flex-direction: column; gap: 2px; margin: 0 3px 5px; overflow: auto; }
    .queue-item { display: grid; min-height: 28px; grid-template-columns: auto minmax(0, 1fr) auto auto auto; align-items: center; gap: 5px; padding: 3px 4px 3px 8px; border-left: 2px solid var(--line); border-radius: 4px; background: var(--activity); font-size: 11px; }
    .queue-item.steer { border-left-color: var(--accent); }
    .queue-kind { color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .queue-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item button { height: 22px; padding: 0 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); font-size: 10px; }
    .queue-item button:hover { border-color: var(--line); background: var(--surface-2); color: var(--text); }
    .queue-item button.queue-steer { color: var(--accent); }
    .queue-item.editing { outline: 1px solid var(--accent); }

    dialog { width: min(560px, calc(100vw - 28px)); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: 0 24px 80px var(--shadow); }
    dialog::backdrop { background: #0008; }
    .dialog-body { padding: 20px; }
    .dialog-body h2 { margin: 0 0 16px; font-size: 18px; }
    .dialog-body label { display: block; margin: 11px 0; color: var(--muted); font-size: 12px; }
    .dialog-body input, .dialog-body select { display: block; width: 100%; margin-top: 5px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .dialog-actions button { padding: 8px 13px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
    .dialog-actions .primary { border: 0; }
    #folderDialog { width: min(620px, calc(100vw - 28px)); }
    .folder-toolbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; }
    .folder-toolbar button, .folder-create button { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
    #folderPath { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    #folderList { height: 280px; margin-top: 8px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    .folder-row { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 9px; border: 0; border-bottom: 1px solid var(--line-soft); border-radius: 0; background: transparent; color: var(--text); text-align: left; }
    .folder-row:hover { background: var(--surface-2); }
    .folder-empty { padding: 18px; color: var(--muted); text-align: center; }
    .folder-create { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 8px; }
    .folder-create input { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .settings-grid .wide { grid-column: 1 / -1; }
    .check { display: flex !important; align-items: center; gap: 8px; }
    .check input { width: auto !important; margin: 0 !important; }
    .meta { color: var(--muted); font-size: 11px; }

    @media (max-width: 780px) {
      #app { grid-template-columns: 1fr; }
      #sidebar { display: none; }
      #folderBtn { max-width: 44vw; }
      #usage { display: none; }
      .chat-inner { width: min(100% - 24px, 790px); }
      #composerWrap { padding: 0 10px 10px; }
      #model { width: 145px; }
    }
  </style>
</head>
<body>
  <section id="auth" class="hidden">
    <h1>🐈 BashKitten</h1>
    <p id="authHint"></p>
    <form id="authForm">
      <input id="username" autocomplete="username" placeholder="Username" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" required minlength="8">
      <button class="primary" type="submit">Continue</button>
      <p id="authError" class="meta"></p>
    </form>
  </section>

  <section id="app" class="hidden">
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="newBtn" class="new-chat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h7"/><path d="m16.5 3.5 4 4L11 17H7v-4z"/></svg>
          <span>New chat</span>
        </button>
        <button id="settingsBtn" class="icon-button" type="button" title="Settings" aria-label="Settings">
          <span class="settings-glyph" aria-hidden="true">&#9881;&#xfe0e;</span>
        </button>
      </div>
      <div id="sessions"></div>
    </aside>

    <main id="workspace">
      <header class="topbar">
        <div class="chat-heading">
          <strong id="title">New chat</strong>
          <button id="folderBtn" type="button" title="Set working folder"><span aria-hidden="true">⌁</span><span id="folderLabel">Set folder</span></button>
        </div>
        <span id="usage"></span>
        <button id="stopBtn" class="hidden" type="button">Stop</button>
      </header>
      <div id="chat"><div id="chatInner" class="chat-inner"></div></div>
      <section id="settingsView" class="hidden">
        <form id="settingsForm" class="settings-page">
          <h2>Settings</h2>
          <div class="settings-grid">
            <label>Web port<input id="webPort" type="number" min="1024" max="65535"></label>
            <label>Appearance<select id="theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
            <label class="wide">Default working folder<input id="defaultCwd"></label>
            <label>Default model<select id="defaultModel"></select></label>
            <label>Default thinking<select id="defaultThinking"></select></label>
            <label class="check wide"><input id="llamaEnabled" type="checkbox"> Enable managed llama.cpp router</label>
            <label>llama.cpp port<input id="llamaPort" type="number"></label>
            <label>Context size<input id="llamaContext" type="number"></label>
          </div>
          <div class="dialog-actions">
            <button id="importPi" type="button">Import Pi login</button>
            <button id="restartLlama" type="button">Restart llama.cpp</button>
          </div>
          <div class="dialog-actions"><button id="settingsDone" type="button">Done</button><button class="primary">Save</button></div>
          <p class="meta">Port changes apply when the Web service restarts. BashKitten performs no telemetry or update checks.</p>
        </form>
      </section>
      <div id="composerWrap">
        <form id="composer">
          <div id="queuePanel" class="hidden" aria-label="Queued messages"></div>
          <div id="attachmentTray" class="hidden"></div>
          <div class="compose-box">
            <textarea id="prompt" rows="2" placeholder="Message BashKitten…" aria-label="Message BashKitten"></textarea>
            <div class="composer-toolbar">
              <input id="files" class="hidden" type="file" multiple>
              <button id="attachBtn" class="icon-button" type="button" title="Attach files" aria-label="Attach files">＋</button>
              <select id="model" title="Model"></select>
              <select id="thinking" title="Thinking level"></select>
              <span class="toolbar-spacer"></span>
              <button id="sendBtn" class="primary" type="submit" title="Send" aria-label="Send">↑</button>
            </div>
          </div>
          <div id="composerHint">Paste, drag, or attach files</div>
        </form>
      </div>
    </main>
  </section>

  <dialog id="folderDialog">
    <form id="folderForm" class="dialog-body">
      <h2>Working folder</h2>
      <div class="folder-toolbar">
        <button id="folderUp" type="button" title="Parent folder">↑</button>
        <input id="folderPath" required aria-label="Current folder" placeholder="/home/user/project">
        <button id="folderGo" type="button">Go</button>
      </div>
      <div id="folderList" aria-label="Folders"></div>
      <div class="folder-create">
        <input id="newFolderName" aria-label="New folder name" placeholder="New folder name">
        <button id="createFolder" type="button">Create</button>
      </div>
      <p class="meta">Each session keeps the folder it starts with.</p>
      <div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary">Use this folder</button></div>
    </form>
  </dialog>

  <script>
    let csrf = '';
    let hasUser = false;
    let models = [];
    let current = null;
    let source = null;
    let config = null;
    let pendingCwd = '';
    let pendingFiles = [];
    let folderView = {path: '', parent: null};
    let queueState = {busy: false, steeringMessages: [], queuedMessages: []};
    let editingQueueId = null;
    let renderedTurn = null;
    let displayedUsage = null;
    const $ = selector => document.querySelector(selector);

    async function api(url, options = {}) {
      options.headers = options.headers || {};
      if (options.method && options.method !== 'GET') options.headers['x-bashkitten-csrf'] = csrf;
      const response = await fetch(url, options);
      const value = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(value.error || response.statusText);
      return value;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = ['light', 'dark'].includes(theme) ? theme : 'system';
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    }

    function markdown(value) {
      const pieces = String(value ?? '').split(/```/);
      return pieces.map((piece, index) => {
        if (index % 2) {
          const body = piece.replace(/^[^\n]*\n/, '');
          return `<pre><code>${escapeHtml(body)}</code></pre>`;
        }
        const lines = piece.split('\n');
        let html = '';
        let list = '';
        const closeList = () => { if (list) { html += `</${list}>`; list = ''; } };
        for (const line of lines) {
          const bullet = line.match(/^\s*[-*]\s+(.+)/);
          const numbered = line.match(/^\s*\d+[.)]\s+(.+)/);
          if (bullet || numbered) {
            const wanted = bullet ? 'ul' : 'ol';
            if (list !== wanted) { closeList(); html += `<${wanted}>`; list = wanted; }
            html += `<li>${inlineMarkdown((bullet || numbered)[1])}</li>`;
            continue;
          }
          closeList();
          const heading = line.match(/^(#{1,3})\s+(.+)/);
          if (heading) { const level = heading[1].length; html += `<h${level}>${inlineMarkdown(heading[2])}</h${level}>`; }
          else if (line.trim()) html += `<p>${inlineMarkdown(line)}</p>`;
        }
        closeList();
        return html;
      }).join('');
    }

    function textBlocks(content) {
      if (typeof content === 'string') return content;
      return (content || []).filter(block => block.type === 'text').map(block => block.text || '').join('\n');
    }

    function messageRow(role, extra = '') {
      const row = document.createElement('div');
      row.className = `message ${role} ${extra}`.trim();
      const body = document.createElement('div');
      body.className = 'message-content';
      row.append(body);
      $('#chatInner').append(row);
      return body;
    }

    function messageTime(value) {
      const time = Number(value);
      return Number.isFinite(time) && time > 0 ? time : Date.now();
    }

    function elapsedLabel(milliseconds) {
      let seconds = Math.max(1, Math.round(milliseconds / 1000));
      const hours = Math.floor(seconds / 3600);
      seconds -= hours * 3600;
      const minutes = Math.floor(seconds / 60);
      seconds -= minutes * 60;
      const parts = [];
      if (hours) parts.push(`${hours}h`);
      if (minutes) parts.push(`${minutes}m`);
      if (seconds || !parts.length) parts.push(`${seconds}s`);
      return parts.join(' ');
    }

    function beginRenderedTurn(timestamp) {
      finishRenderedTurn(timestamp);
      const startedAt = messageTime(timestamp);
      renderedTurn = {startedAt, lastAt: startedAt, work: null, label: null, body: null};
    }

    function touchRenderedTurn(timestamp) {
      if (!renderedTurn) return;
      renderedTurn.lastAt = Math.max(renderedTurn.lastAt, messageTime(timestamp));
    }

    function ensureTurnWork() {
      if (!renderedTurn) beginRenderedTurn(Date.now());
      if (renderedTurn.work) {
        renderedTurn.work.open = true;
        return renderedTurn.body;
      }
      const work = document.createElement('details');
      work.className = 'turn-work';
      work.open = true;
      const summary = document.createElement('summary');
      const label = document.createElement('span');
      label.textContent = 'Working…';
      summary.append(label);
      const body = document.createElement('div');
      body.className = 'turn-work-body';
      work.append(summary, body);
      $('#chatInner').append(work);
      renderedTurn.work = work;
      renderedTurn.label = label;
      renderedTurn.body = body;
      return body;
    }

    function finishRenderedTurn(timestamp) {
      if (!renderedTurn) return;
      touchRenderedTurn(timestamp);
      if (renderedTurn.work) {
        renderedTurn.label.textContent = `Worked for ${elapsedLabel(renderedTurn.lastAt - renderedTurn.startedAt)}`;
        renderedTurn.work.open = false;
      }
      renderedTurn = null;
    }

    function renderThinking(value, live = false) {
      if (!value && !live) return;
      const work = ensureTurnWork();
      let block = live ? $('#liveThinking') : null;
      if (!block) {
        block = document.createElement('div');
        block.className = 'thinking-block';
        if (live) block.id = 'liveThinking';
        const label = document.createElement('span');
        label.className = 'thinking-label';
        label.textContent = live ? 'Thinking…' : 'Thinking';
        const text = document.createElement('pre');
        block.append(label, text);
        work.append(block);
      }
      const text = block.querySelector('pre');
      if (live) text.textContent += value;
      else text.textContent = value;
    }

    function renderImages(content, body) {
      const images = (Array.isArray(content) ? content : []).filter(block => block.type === 'image');
      if (!images.length) return;
      const holder = document.createElement('div');
      holder.className = 'message-images';
      for (const block of images) {
        const image = document.createElement('img');
        image.alt = 'Attached image';
        image.src = `data:${block.mimeType};base64,${block.data}`;
        holder.append(image);
      }
      body.append(holder);
    }

    function toolPresentation(block) {
      const value = block.arguments || {};
      const path = value.path || '.';
      const presentations = {
        bash: ['Ran', value.command || 'shell command'],
        read: ['Read', `${path}${value.offset ? ` from line ${value.offset}` : ''}`],
        write: ['Wrote', path],
        edit: ['Edited', path],
        ls: ['Listed', path],
        find: ['Searched files', `${value.pattern || value.glob || '*'} in ${path}`],
        grep: ['Searched text', `${value.pattern || value.query || ''} in ${path}`]
      };
      const [action, focusValue] = presentations[block.name] || [`Ran ${block.name}`, value.path || value.command || ''];
      const focus = typeof focusValue === 'string' ? focusValue : JSON.stringify(focusValue);
      return {action, focus: focus.length > 130 ? `${focus.slice(0, 129)}…` : focus};
    }

    function findTool(callId) {
      return [...document.querySelectorAll('.activity[data-call]')].reverse().find(node => node.dataset.call === callId);
    }

    function renderToolCall(block, body) {
      let details = findTool(block.id);
      if (details) return details;
      details = document.createElement('details');
      details.className = 'activity';
      details.dataset.call = block.id;
      details.title = JSON.stringify(block.arguments || {});
      const summary = document.createElement('summary');
      const icon = document.createElement('span');
      icon.className = 'tool-icon';
      icon.textContent = '>_';
      const presentation = toolPresentation(block);
      const name = document.createElement('span');
      name.className = 'tool-name';
      name.textContent = presentation.action;
      const focus = document.createElement('span');
      focus.className = 'tool-focus';
      focus.textContent = presentation.focus;
      const state = document.createElement('span');
      state.className = 'tool-state';
      state.textContent = 'Queued';
      summary.append(icon, name, focus);
      const toolBody = document.createElement('div');
      toolBody.className = 'tool-body';
      toolBody.append(state);
      details.append(summary, toolBody);
      body.append(details);
      return details;
    }

    function renderToolResult(message) {
      touchRenderedTurn(message.timestamp);
      let details = findTool(message.toolCallId);
      if (!details) {
        const body = ensureTurnWork();
        details = renderToolCall({id: message.toolCallId, name: message.toolName, arguments: {}}, body);
      }
      details.classList.toggle('error', Boolean(message.isError));
      const state = details.querySelector('.tool-state');
      state.textContent = message.isError ? 'Failed' : '✓ Success';
      const toolBody = details.querySelector('.tool-body');
      const output = document.createElement('pre');
      output.textContent = textBlocks(message.content) || '(no output)';
      toolBody.insertBefore(output, state);
      if (message.details?.diff) {
        const diff = document.createElement('pre');
        diff.textContent = message.details.diff;
        toolBody.insertBefore(diff, state);
      }
      updateUsage(message.usage);
    }

    function resetUsage() {
      displayedUsage = {
        input: 0,
        output: 0,
        cacheRead: 0,
        cacheWrite: 0,
        cost: 0,
        latestCacheHitRate: null,
        contextTokens: null,
        contextModel: null,
        subscription: false
      };
      $('#usage').textContent = '';
    }

    function usageModel(modelId) {
      return models.find(model => `${model.provider}/${model.id}` === modelId);
    }

    function calculatedUsageCost(usage, model) {
      if (!model?.cost) return 0;
      const promptTokens = (usage.input || 0) + (usage.cacheRead || 0) + (usage.cacheWrite || 0);
      let rates = model.cost;
      let threshold = -1;
      for (const tier of model.cost.tiers || []) {
        if (promptTokens > tier.inputTokensAbove && tier.inputTokensAbove > threshold) {
          rates = tier;
          threshold = tier.inputTokensAbove;
        }
      }
      const longWrite = usage.cacheWrite1h || 0;
      const shortWrite = Math.max(0, (usage.cacheWrite || 0) - longWrite);
      return (
        (rates.input || 0) * (usage.input || 0) +
        (rates.output || 0) * (usage.output || 0) +
        (rates.cacheRead || 0) * (usage.cacheRead || 0) +
        (rates.cacheWrite || 0) * shortWrite +
        (rates.input || 0) * 2 * longWrite
      ) / 1_000_000;
    }

    function renderUsage() {
      if (!displayedUsage) return;
      const model = usageModel(displayedUsage.contextModel || $('#model').value);
      const context = model?.context_window || 0;
      const parts = [];
      if (displayedUsage.input) parts.push(`↑${formatTokens(displayedUsage.input)}`);
      if (displayedUsage.output) parts.push(`↓${formatTokens(displayedUsage.output)}`);
      if (displayedUsage.cacheRead) parts.push(`R${formatTokens(displayedUsage.cacheRead)}`);
      if (displayedUsage.cacheWrite) parts.push(`W${formatTokens(displayedUsage.cacheWrite)}`);
      if ((displayedUsage.cacheRead || displayedUsage.cacheWrite) && displayedUsage.latestCacheHitRate !== null) {
        parts.push(`CH${displayedUsage.latestCacheHitRate.toFixed(1)}%`);
      }
      if (displayedUsage.cost || displayedUsage.subscription) {
        parts.push(`$${displayedUsage.cost.toFixed(3)}${displayedUsage.subscription ? ' (sub)' : ''}`);
      }
      if (context) {
        const contextLabel = displayedUsage.contextTokens === null
          ? `?/${formatTokens(context)}`
          : `${(displayedUsage.contextTokens / context * 100).toFixed(1)}%/${formatTokens(context)}`;
        parts.push(contextLabel);
      }
      $('#usage').textContent = parts.join('  ');
    }

    function updateUsage(usage, modelId = null) {
      if (!usage) return;
      if (!displayedUsage) resetUsage();
      const model = usageModel(modelId || $('#model').value);
      displayedUsage.input += usage.input || 0;
      displayedUsage.output += usage.output || 0;
      displayedUsage.cacheRead += usage.cacheRead || 0;
      displayedUsage.cacheWrite += usage.cacheWrite || 0;
      const promptTokens = (usage.input || 0) + (usage.cacheRead || 0) + (usage.cacheWrite || 0);
      if (promptTokens > 0) displayedUsage.latestCacheHitRate = (usage.cacheRead || 0) / promptTokens * 100;
      if ((usage.totalTokens || 0) > 0) displayedUsage.contextTokens = usage.totalTokens;
      if (modelId) displayedUsage.contextModel = modelId;
      if (model?.provider === 'openai-codex') displayedUsage.subscription = true;
      const recordedCost = Number(usage.cost?.total || 0);
      displayedUsage.cost += recordedCost || calculatedUsageCost(usage, model);
      renderUsage();
    }

    function formatTokens(value) {
      if (value < 1000) return String(value);
      if (value < 10000) return `${(value / 1000).toFixed(1)}k`;
      if (value < 1000000) return `${Math.round(value / 1000)}k`;
      return `${(value / 1000000).toFixed(value < 10000000 ? 1 : 0)}M`;
    }

    function renderMessage(message) {
      if (!message) return;
      if (message.role === 'toolResult') return renderToolResult(message);
      if (message.role === 'user') {
        beginRenderedTurn(message.timestamp);
        const body = messageRow('user');
        const text = textBlocks(message.content);
        if (text) { const content = document.createElement('div'); content.className = 'markdown'; content.innerHTML = markdown(text); body.append(content); }
        renderImages(message.content, body);
        return;
      }
      if (message.role !== 'assistant') return;
      touchRenderedTurn(message.timestamp);
      const modelId = `${message.provider}/${message.responseModel || message.model}`;
      if (message.errorMessage) {
        finishRenderedTurn(message.timestamp);
        const body = messageRow('assistant', 'error');
        body.textContent = message.errorMessage;
        updateUsage(message.usage, modelId);
        return;
      }
      const text = [];
      let hasToolCall = false;
      for (const block of message.content || []) {
        if (block.type === 'text' && block.text) {
          text.push(block.text);
        } else if (block.type === 'thinking' && block.thinking) {
          renderThinking(block.thinking);
        } else if (block.type === 'toolCall') {
          hasToolCall = true;
          renderToolCall(block, ensureTurnWork());
        }
      }
      if (text.length) {
        if (!hasToolCall) finishRenderedTurn(message.timestamp);
        const body = messageRow('assistant');
        const content = document.createElement('div');
        content.className = 'markdown';
        content.innerHTML = markdown(text.join('\n'));
        body.append(content);
      }
      updateUsage(message.usage, modelId);
    }

    function clearLive() {
      $('#liveAssistant')?.remove();
      $('#liveThinking')?.remove();
    }

    function renderEvent(event) {
      if (event.type === 'session') return;
      if (event.type === 'assistant_delta') {
        let body = $('#liveAssistant .message-content');
        if (!body) { body = messageRow('assistant'); body.parentElement.id = 'liveAssistant'; }
        body.textContent += event.delta;
      } else if (event.type === 'thinking_delta') {
        renderThinking(event.delta, true);
      } else if (event.type === 'message') {
        clearLive();
        renderMessage(event.message);
      } else if (event.type === 'tool_start') {
        const details = findTool(event.id);
        if (details) {
          details.closest('.turn-work-body')?.querySelectorAll('.activity[open]').forEach(item => { if (item !== details) item.open = false; });
          details.open = true;
          details.querySelector('.tool-state').textContent = 'Running';
        }
      } else if (event.type === 'agent_start') {
        queueState.busy = true;
        if (renderedTurn?.work) renderedTurn.work.open = true;
        $('#stopBtn').classList.remove('hidden');
        $('#composerHint').textContent = 'Agent is working';
      } else if (event.type === 'turn_end') {
        finishRenderedTurn(Date.now());
      } else if (event.type === 'agent_end') {
        finishRenderedTurn(Date.now());
        queueState.busy = false;
        $('#stopBtn').classList.add('hidden');
        $('#composerHint').textContent = 'Paste, drag, or attach files';
        loadSessions().catch(() => {});
        setTimeout(async () => {
          await refreshQueue().catch(() => {});
          if (!queueState.busy && !queuedItems().length) {
            source?.close();
            source = null;
          }
        }, 120);
      } else if (event.type === 'queue_state') {
        renderQueueState(event.data);
      } else if (event.type === 'model_change') {
        $('#composerHint').textContent = `Using ${event.model}`;
      } else if (event.type === 'compaction_start') {
        $('#composerHint').textContent = 'Compacting context…';
      }
      $('#chat').scrollTop = $('#chat').scrollHeight;
    }

    function renderEntry(entry) {
      if (entry.type === 'message') renderMessage(entry.message);
      else if (entry.type === 'compaction') {
        updateUsage(entry.usage);
        const details = document.createElement('details');
        details.className = 'turn-work';
        details.innerHTML = `<summary><span>Compacted ${escapeHtml(formatTokens(entry.tokensBefore || 0))} tokens</span></summary><div class="turn-work-body"><div class="thinking-block"><pre>${escapeHtml(entry.summary || '')}</pre></div></div>`;
        $('#chatInner').append(details);
      }
    }

    function showWelcome() {
      $('#chatInner').innerHTML = '<div class="welcome"><div><div class="cat">🐈</div><strong>What are we working on?</strong><p>Choose a folder, then send the first message.</p></div></div>';
    }

    function fillSelect(element, list, chosen) {
      element.innerHTML = list.map(model => `<option value="${escapeHtml(`${model.provider}/${model.id}`)}">${escapeHtml(model.name)}</option>`).join('');
      if (chosen && list.some(model => `${model.provider}/${model.id}` === chosen)) element.value = chosen;
      setThinking(element);
    }

    function setThinking(modelElement, target = $('#thinking')) {
      const model = models.find(value => `${value.provider}/${value.id}` === modelElement.value);
      const old = target.value;
      target.innerHTML = (model?.thinking_levels || ['off']).map(level => `<option value="${escapeHtml(level)}">${escapeHtml(level)}</option>`).join('');
      target.value = (model?.thinking_levels || []).includes(old) ? old : (model?.default_thinking || 'off');
    }

    async function loadModels() {
      const value = await api('/api/models');
      models = value.models.filter(model => model.available);
      fillSelect($('#model'), models, value.defaultModel);
      fillSelect($('#defaultModel'), models, value.defaultModel);
      setThinking($('#defaultModel'), $('#defaultThinking'));
      $('#thinking').value = value.defaultThinking;
      $('#defaultThinking').value = value.defaultThinking;
    }

    async function loadSettings() {
      const value = await api('/api/settings');
      config = value.config;
      applyTheme(config.theme);
      pendingCwd = config.default_cwd;
      $('#webPort').value = config.web_port;
      $('#theme').value = config.theme || 'system';
      $('#defaultCwd').value = config.default_cwd;
      $('#llamaEnabled').checked = config.llama.enabled;
      $('#llamaPort').value = config.llama.port;
      $('#llamaContext').value = config.llama.context_size;
    }

    function queuedItems() {
      return [
        ...(queueState.steeringMessages || []).map(item => ({...item, kind: 'steer'})),
        ...(queueState.queuedMessages || []).map(item => ({...item, kind: 'queued'}))
      ];
    }

    function renderQueueState(value = {}) {
      queueState = {
        busy: Boolean(value.busy),
        steeringMessages: value.steeringMessages || [],
        queuedMessages: value.queuedMessages || []
      };
      const panel = $('#queuePanel');
      panel.innerHTML = '';
      const items = queuedItems();
      panel.classList.toggle('hidden', !items.length);
      for (const item of items) {
        const row = document.createElement('div');
        row.className = `queue-item ${item.kind === 'steer' ? 'steer' : ''} ${editingQueueId === item.id ? 'editing' : ''}`.trim();
        const kind = document.createElement('span');
        kind.className = 'queue-kind';
        kind.textContent = item.kind;
        const text = document.createElement('span');
        text.className = 'queue-text';
        text.textContent = item.content || (item.attachments?.length ? `${item.attachments.length} attachment(s)` : '(empty message)');
        text.title = item.content || '';
        row.append(kind, text);
        if (item.kind !== 'steer') {
          const steer = document.createElement('button');
          steer.type = 'button';
          steer.className = 'queue-steer';
          steer.textContent = 'Steer';
          steer.title = 'Deliver at the next safe agent boundary';
          steer.onclick = () => mutateQueued(item.id, 'promote');
          row.append(steer);
        } else {
          row.append(document.createElement('span'));
        }
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Edit';
        edit.onclick = () => beginQueueEdit(item);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = 'Remove queued message';
        remove.onclick = () => mutateQueued(item.id, 'remove');
        row.append(edit, remove);
        panel.append(row);
      }
    }

    async function refreshQueue() {
      if (!current) return renderQueueState();
      const value = await api(`/api/sessions/${current.id}/status`);
      renderQueueState(value.data);
    }

    async function mutateQueued(id, action, content = null) {
      if (!current) return;
      try {
        const value = await api(`/api/sessions/${current.id}/queue`, {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({id, action, content})
        });
        if (editingQueueId === id) cancelQueueEdit();
        renderQueueState(value.data);
      } catch (error) {
        await refreshQueue().catch(() => {});
        alert(error.message);
      }
    }

    function beginQueueEdit(item) {
      editingQueueId = item.id;
      pendingFiles = [];
      renderAttachments();
      $('#prompt').value = item.content || '';
      $('#prompt').dispatchEvent(new Event('input'));
      $('#composerHint').textContent = 'Editing queued message · Esc to cancel';
      $('#attachBtn').disabled = true;
      renderQueueState(queueState);
      $('#prompt').focus();
    }

    function cancelQueueEdit() {
      editingQueueId = null;
      $('#prompt').value = '';
      $('#prompt').style.height = 'auto';
      $('#composerHint').textContent = queueState.busy ? 'Agent is working' : 'Paste, drag, or attach files';
      $('#attachBtn').disabled = false;
      renderQueueState(queueState);
    }

    function folderDisplayName(path) {
      const normalized = String(path || '').replace(/\/+$/, '');
      if (!normalized) return path === '/' ? '/' : 'Unknown folder';
      return normalized.split('/').pop() || normalized;
    }

    function renderSessionSidebar(sessions) {
      const root = $('#sessions');
      root.innerHTML = '';
      const groups = new Map();
      for (const session of sessions) {
        const folder = session.cwd || '';
        if (!groups.has(folder)) groups.set(folder, []);
        groups.get(folder).push(session);
      }
      for (const [folder, groupSessions] of groups) {
        const group = document.createElement('section');
        group.className = 'folder-group';
        const heading = document.createElement('div');
        heading.className = 'folder-heading';
        heading.title = folder || 'Working folder unavailable';
        heading.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>';
        const label = document.createElement('span');
        label.textContent = folderDisplayName(folder);
        heading.append(label);
        group.append(heading);
        for (const session of groupSessions) {
          const item = document.createElement('div');
          item.className = `session${current?.id === session.id ? ' active' : ''}`;
          item.dataset.id = session.id;
          item.title = session.title;
          const title = document.createElement('b');
          title.textContent = session.title;
          item.append(title);
          if (session.running) {
            const dot = document.createElement('span');
            dot.className = 'running-dot';
            dot.title = 'Running';
            item.append(dot);
          }
          item.onclick = () => openSession(session);
          group.append(item);
        }
        root.append(group);
      }
    }

    async function loadSessions() {
      const value = await api('/api/sessions?limit=100');
      renderSessionSidebar(value.sessions);
      return value.sessions;
    }

    function showChatView() {
      $('#settingsView').classList.add('hidden');
      $('#chat').classList.remove('hidden');
      $('#composerWrap').classList.remove('hidden');
      $('#settingsBtn').classList.remove('active');
      $('#folderBtn').classList.remove('hidden');
      $('#usage').classList.remove('hidden');
      $('#title').textContent = current?.title || 'New chat';
      $('#folderLabel').textContent = current?.cwd || pendingCwd || 'Set folder';
      $('#folderBtn').disabled = Boolean(current);
      $('#stopBtn').classList.toggle('hidden', !current?.running);
      if (current) renderUsage();
      else $('#usage').textContent = '';
    }

    function showSettingsView() {
      $('#chat').classList.add('hidden');
      $('#composerWrap').classList.add('hidden');
      $('#settingsView').classList.remove('hidden');
      $('#settingsBtn').classList.add('active');
      $('#title').textContent = 'Settings';
      $('#folderBtn').classList.add('hidden');
      $('#usage').classList.add('hidden');
      $('#stopBtn').classList.add('hidden');
    }

    function connectSession(id, consume = renderEvent) {
      source?.close();
      return new Promise((resolve, reject) => {
        const stream = new EventSource(`/api/sessions/${id}/events`);
        source = stream;
        let subscribed = false;
        const timeout = setTimeout(() => {
          if (!subscribed) {
            stream.close();
            if (source === stream) source = null;
            reject(new Error('Could not connect to the agent session'));
          }
        }, 5000);
        stream.onmessage = event => {
          try {
            const value = JSON.parse(event.data);
            if (!value.type && value.ok && value.message === 'subscribed') {
              subscribed = true;
              clearTimeout(timeout);
              resolve();
              return;
            }
            consume(value);
          } catch {}
        };
        stream.addEventListener('offline', () => {
          clearTimeout(timeout);
          stream.close();
          if (source === stream) source = null;
          if (!subscribed) reject(new Error('Agent session is offline'));
        });
      });
    }

    async function openSession(session) {
      if (!session) return;
      current = session;
      showChatView();
      source?.close();
      source = null;
      pendingFiles = [];
      renderAttachments();
      $('#title').textContent = session.title;
      $('#folderLabel').textContent = session.cwd || 'Working folder';
      $('#folderBtn').disabled = true;
      $('#folderBtn').title = 'The working folder is fixed for this session';
      $('#stopBtn').classList.toggle('hidden', !session.running);
      if (session.model) {
        $('#model').value = session.model;
        setThinking($('#model'));
        $('#thinking').value = session.thinking || 'off';
      }
      renderedTurn = null;
      resetUsage();
      $('#chatInner').innerHTML = '';
      const pendingEvents = [];
      let bufferingEvents = Boolean(session.running);
      if (session.running) {
        await connectSession(session.id, value => {
          if (bufferingEvents) pendingEvents.push(value);
          else renderEvent(value);
        }).catch(() => {});
      }
      const history = await api(`/api/sessions/${session.id}/segments/${session.current_segment}`);
      history.entries.forEach(renderEntry);
      if (renderedTurn) finishRenderedTurn(renderedTurn.lastAt);
      bufferingEvents = false;
      pendingEvents.forEach(renderEvent);
      await refreshQueue().catch(() => renderQueueState());
      document.querySelectorAll('.session').forEach(element => element.classList.toggle('active', element.dataset.id === session.id));
      $('#chat').scrollTop = $('#chat').scrollHeight;
    }

    function beginNewSession() {
      current = null;
      showChatView();
      source?.close();
      source = null;
      pendingFiles = [];
      editingQueueId = null;
      renderedTurn = null;
      displayedUsage = null;
      renderAttachments();
      renderQueueState();
      pendingCwd = config?.default_cwd || '';
      $('#title').textContent = 'New chat';
      $('#folderLabel').textContent = pendingCwd || 'Set folder';
      $('#folderBtn').disabled = false;
      $('#folderBtn').title = 'Set working folder';
      $('#stopBtn').classList.add('hidden');
      $('#usage').textContent = '';
      if (config) {
        $('#model').value = config.default_model;
        setThinking($('#model'));
        $('#thinking').value = config.default_thinking;
      }
      document.querySelectorAll('.session').forEach(element => element.classList.remove('active'));
      showWelcome();
      $('#prompt').focus();
    }

    function addAttachments(files) {
      for (const file of files) pendingFiles.push(file);
      renderAttachments();
    }

    function renderAttachments() {
      const tray = $('#attachmentTray');
      tray.innerHTML = '';
      tray.classList.toggle('hidden', !pendingFiles.length);
      pendingFiles.forEach((file, index) => {
        const item = document.createElement('div');
        const isImage = file.type.startsWith('image/');
        item.className = `attachment${isImage ? '' : ' file'}`;
        item.title = file.name;
        if (isImage) {
          const image = document.createElement('img');
          image.src = URL.createObjectURL(file);
          image.alt = file.name;
          image.onload = () => URL.revokeObjectURL(image.src);
          item.append(image);
        } else {
          const kind = document.createElement('span');
          kind.className = 'attachment-kind';
          kind.textContent = (file.name.split('.').pop() || 'FILE').slice(0, 5).toUpperCase();
          const name = document.createElement('span');
          name.className = 'attachment-name';
          name.textContent = file.name;
          item.append(kind, name);
        }
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.onclick = () => { pendingFiles.splice(index, 1); renderAttachments(); };
        item.append(remove);
        tray.append(item);
      });
    }

    async function applyCurrentModel() {
      if (!current) return;
      await api(`/api/sessions/${current.id}/model`, {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({model: $('#model').value, thinking: $('#thinking').value})
      });
      current.model = $('#model').value;
      current.thinking = $('#thinking').value;
      $('#composerHint').textContent = `Switching to ${models.find(model => `${model.provider}/${model.id}` === current.model)?.name || current.model}`;
      loadSessions().catch(() => {});
    }

    function authScreen(signup) {
      hasUser = !signup;
      $('#app').classList.add('hidden');
      $('#auth').classList.remove('hidden');
      $('#authHint').textContent = signup ? 'Create the one local Web UI account.' : 'Sign in to the local Web UI.';
    }

    async function boot() {
      const value = await api('/api/bootstrap');
      if (!value.hasUser) return authScreen(true);
      if (!value.authenticated) return authScreen(false);
      csrf = value.csrf;
      $('#auth').classList.add('hidden');
      $('#app').classList.remove('hidden');
      await loadSettings();
      await loadModels();
      const sessions = await loadSessions();
      if (sessions.length) await openSession(sessions[0]);
      else beginNewSession();
    }

    $('#authForm').onsubmit = async event => {
      event.preventDefault();
      try {
        const value = await api(hasUser ? '/api/login' : '/api/signup', {
          method: 'POST', headers: {'content-type': 'application/json'},
          body: JSON.stringify({username: $('#username').value, password: $('#password').value})
        });
        csrf = value.csrf;
        await boot();
      } catch (error) { $('#authError').textContent = error.message; }
    };

    $('#newBtn').onclick = beginNewSession;
    async function loadFolder(path) {
      const value = await api(`/api/folders?path=${encodeURIComponent(path || pendingCwd)}`);
      folderView = value;
      $('#folderPath').value = value.path;
      $('#folderUp').disabled = !value.parent;
      const list = $('#folderList');
      list.innerHTML = '';
      if (!value.folders.length) {
        list.innerHTML = '<div class="folder-empty">No subfolders</div>';
        return;
      }
      for (const folder of value.folders) {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'folder-row';
        row.innerHTML = `<span aria-hidden="true">▸</span><span>${escapeHtml(folder.name)}</span>`;
        row.onclick = () => loadFolder(folder.path).catch(error => alert(error.message));
        list.append(row);
      }
    }

    $('#folderBtn').onclick = async () => {
      if (current) return;
      $('#folderDialog').showModal();
      try { await loadFolder(pendingCwd); }
      catch (error) { alert(error.message); }
    };
    $('#folderGo').onclick = () => loadFolder($('#folderPath').value.trim()).catch(error => alert(error.message));
    $('#folderUp').onclick = () => folderView.parent && loadFolder(folderView.parent).catch(error => alert(error.message));
    $('#createFolder').onclick = async () => {
      const name = $('#newFolderName').value.trim();
      if (!name) return;
      try {
        const value = await api('/api/folders', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({parent: folderView.path, name})
        });
        $('#newFolderName').value = '';
        await loadFolder(value.path);
      } catch (error) { alert(error.message); }
    };
    $('#folderForm').onsubmit = async event => {
      event.preventDefault();
      try {
        if ($('#folderPath').value.trim() !== folderView.path) await loadFolder($('#folderPath').value.trim());
      } catch (error) {
        alert(error.message);
        return;
      }
      pendingCwd = folderView.path;
      $('#folderLabel').textContent = pendingCwd || 'Set folder';
      $('#folderDialog').close();
      $('#prompt').focus();
    };
    document.querySelectorAll('[data-close]').forEach(button => button.onclick = () => button.closest('dialog').close());

    $('#attachBtn').onclick = () => $('#files').click();
    $('#files').onchange = event => { addAttachments(event.target.files); event.target.value = ''; };
    $('#prompt').addEventListener('paste', event => {
      const files = [...(event.clipboardData?.files || [])];
      if (files.length) { event.preventDefault(); addAttachments(files); }
    });
    const composeBox = $('.compose-box');
    composeBox.addEventListener('dragenter', event => { event.preventDefault(); composeBox.classList.add('dragging'); });
    composeBox.addEventListener('dragover', event => { event.preventDefault(); composeBox.classList.add('dragging'); });
    composeBox.addEventListener('dragleave', event => { if (!event.relatedTarget || !composeBox.contains(event.relatedTarget)) composeBox.classList.remove('dragging'); });
    composeBox.addEventListener('drop', event => { event.preventDefault(); composeBox.classList.remove('dragging'); addAttachments(event.dataTransfer.files); });
    $('#prompt').addEventListener('input', event => { event.target.style.height = 'auto'; event.target.style.height = `${Math.min(event.target.scrollHeight, 190)}px`; });
    $('#prompt').addEventListener('keydown', event => {
      if (event.key === 'Escape' && editingQueueId) { event.preventDefault(); cancelQueueEdit(); }
      else if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('#composer').requestSubmit(); }
    });

    $('#model').onchange = async () => { setThinking($('#model')); try { await applyCurrentModel(); } catch (error) { alert(error.message); } };
    $('#thinking').onchange = async () => { try { await applyCurrentModel(); } catch (error) { alert(error.message); } };
    $('#defaultModel').onchange = () => setThinking($('#defaultModel'), $('#defaultThinking'));

    $('#composer').onsubmit = async event => {
      event.preventDefault();
      const text = $('#prompt').value.trim();
      if (!text && !pendingFiles.length) return;
      if (editingQueueId) {
        if (!text) return;
        $('#sendBtn').disabled = true;
        await mutateQueued(editingQueueId, 'edit', text);
        $('#sendBtn').disabled = false;
        return;
      }
      const files = [...pendingFiles];
      $('#prompt').value = '';
      $('#prompt').style.height = 'auto';
      pendingFiles = [];
      renderAttachments();
      if ($('#chatInner .welcome')) $('#chatInner').innerHTML = '';
      $('#sendBtn').disabled = true;
      try {
        if (!current) {
          const createForm = new FormData();
          createForm.append('prompt', text);
          createForm.append('cwd', pendingCwd);
          createForm.append('model', $('#model').value);
          createForm.append('thinking', $('#thinking').value);
          const result = await api('/api/sessions', {method: 'POST', body: createForm});
          const sessions = await loadSessions();
          current = sessions.find(session => session.id === result.id) || {id: result.id, title: text || 'Image session', cwd: pendingCwd, model: $('#model').value, thinking: $('#thinking').value, running: true};
          renderSessionSidebar(sessions);
          $('#title').textContent = current.title;
          $('#folderLabel').textContent = current.cwd;
          $('#folderBtn').disabled = true;
        }
        if (!source) await connectSession(current.id);
        const messageForm = new FormData();
        messageForm.append('content', text);
        messageForm.append('delivery', 'queue');
        for (const file of files) messageForm.append('file', file);
        const result = await api(`/api/sessions/${current.id}/messages`, {method: 'POST', body: messageForm});
        renderQueueState(result.data);
        setTimeout(() => refreshQueue().catch(() => {}), 100);
        $('#stopBtn').classList.remove('hidden');
      } catch (error) {
        const body = messageRow('assistant', 'error');
        body.textContent = error.message;
      } finally { $('#sendBtn').disabled = false; }
    };

    $('#stopBtn').onclick = async () => {
      if (!current) return;
      await api(`/api/sessions/${current.id}/stop`, {method: 'POST'});
      source?.close();
      source = null;
      $('#stopBtn').classList.add('hidden');
      await loadSessions();
    };

    $('#settingsBtn').onclick = () => {
      if ($('#settingsView').classList.contains('hidden')) showSettingsView();
      else showChatView();
    };
    $('#settingsDone').onclick = showChatView;
    $('#settingsForm').onsubmit = async event => {
      event.preventDefault();
      config.web_port = Number($('#webPort').value);
      config.theme = $('#theme').value;
      config.default_cwd = $('#defaultCwd').value;
      config.default_model = $('#defaultModel').value;
      config.default_thinking = $('#defaultThinking').value;
      config.llama.enabled = $('#llamaEnabled').checked;
      config.llama.port = Number($('#llamaPort').value);
      config.llama.context_size = Number($('#llamaContext').value);
      await api('/api/settings', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(config)});
      applyTheme(config.theme);
      if (!current) {
        pendingCwd = config.default_cwd;
        $('#model').value = config.default_model;
        setThinking($('#model'));
        $('#thinking').value = config.default_thinking;
      }
    };
    $('#importPi').onclick = async () => {
      try { await api('/api/provider/import-pi', {method: 'POST'}); await loadModels(); alert('Pi OpenAI login imported.'); }
      catch (error) { alert(error.message); }
    };
    $('#restartLlama').onclick = async () => {
      try { await api('/api/llama/restart', {method: 'POST'}); alert('llama.cpp restarted.'); }
      catch (error) { alert(error.message); }
    };

    boot();
    setInterval(() => {
      if (!csrf) return;
      loadSessions().catch(() => {});
      if (current) refreshQueue().catch(() => {});
    }, 5000);
  </script>
</body>
</html>
